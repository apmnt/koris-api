[project]
name = "koris-api"
version = "0.1.0"
description = "Python client for the Basket.fi API"
readme = "README.md"
authors = [
    { name = "apmnt", email = "aapomo@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "requests",
    "textual",
    "pandas",
    "numpy>=1.23",
    "openpyxl",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tqdm>=4.66.0",
    "httpx>=0.27.0",
    "pyarrow>=22.0.0",
    "protobuf>=3.20.3,<8",
]

[project.scripts]
koris-api = "koris_api:main"
koris-tui = "koris_api.tui:run"

[build-system]
requires = ["uv_build>=0.8.10,<0.9.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
strict_equality = true

[tool.ruff]
src = [".", "src", "modeling/src"]
extend-exclude = ["src/koris_api/schema"]

[tool.basedpyright]
# Standard checks catch type errors in legacy/API/UI code without requiring
# every dynamic response and framework callback to have strict annotations.
typeCheckingMode = "standard"
# Keep stronger checks on the typed application core as it grows.
strict = [
    "src/koris_api/api.py",
    "modeling/src/koris_modeling/tables.py",
    "src/koris_api/pipeline",
    "src/koris_api/converters",
    "src/koris_api/analysis",
    "src/koris_api/data.py",
    "src/koris_api/basketfi_parser.py",
    "src/koris_api/boxscore_normalizer.py",
    "src/koris_api/genius_livestats_parser.py",
    "src/koris_api/sportradar_parser.py",
    "src/koris_api/seasons.py",
    "src/koris_api/cli.py",
]
include = ["src", "tests", "modeling/src", "modeling/tests"]
# Both API and modeling use the root workspace environment.
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
# Generated bindings are checked through their consumers, not edited by hand.
ignore = ["src/koris_api/schema"]

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "basedpyright==1.40.2",
    "pandas-stubs>=2.3.3,<3",
    "types-requests>=2.32.4.20250913",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-tqdm>=4.66.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.1,<8",
    "pip>=25.3",
]

modeling = [
    "koris-modeling",
    "altair>=6,<7",
    "matplotlib>=3.10.8",
    "ipykernel>=7.1.0",
    "jupyterlab>=4.4,<5",
    "nbclient>=0.10,<1",
]

[tool.uv.workspace]
members = ["modeling"]

[tool.uv.sources]
koris-modeling = { workspace = true }
koris-api = { workspace = true }

[tool.coverage.run]
branch = true
source = ["koris_api"]
omit = ["*/koris_api/schema/*"]

[tool.coverage.report]
show_missing = true
