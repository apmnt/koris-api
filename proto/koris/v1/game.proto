syntax = "proto3";

package koris.v1;

// Basic game record. Optional fields are absent when unknown.
message Game {
  string id = 1;
  repeated ExternalId external_ids = 2;
  Team home = 3;
  Team away = 4;

  // Local schedule: YYYY-MM-DD and HH:MM (24-hour).
  optional string date = 5;
  optional string time = 6;

  GameStatus status = 7;

  optional string league = 9;
  optional string season = 10;
  // Chronological order; preserve source ordering when clocks are equal.
  repeated Event events = 11;
}

message Team {
  optional string name = 1;
  repeated ExternalId external_ids = 2;
  repeated Player players = 3;
  // Source-reported team totals, including team-only stats where applicable.
  Stats totals = 4;
  // Current score; final only when the game's status is FINAL.
  optional uint32 score = 5;
  // Whether this team won; absent until the result is known.
  optional bool win = 6;
}

message Shot {
  // One-based period across the game, including overtime.
  optional uint32 period = 4;
  // 1 = free throw, 2 or 3 = field goal; absent when unknown.
  optional uint32 point_value = 6;
  // True = made, false = missed; absent when unknown.
  optional bool made = 7;
  // Source coordinates; zero is valid.
  optional double x = 8;
  optional double y = 9;
  // Source shot description, e.g. layup or jump shot.
  optional string shot_type = 10;
  // Source shot/action IDs, scoped to the game when necessary.
  repeated ExternalId external_ids = 11;
  // Time remaining in this period: MM:SS, optionally with fractional seconds.
  optional string game_clock = 12;
  // Matching Game.events[].id when verified; describes the same attempt.
  optional string event_id = 14;
}

message Player {
  optional string name = 1;
  repeated ExternalId external_ids = 2;
  // Preserve jersey numbers such as "00".
  optional string jersey_number = 3;
  Stats stats = 4;
  repeated Shot shots = 5;
  // Game-local ID, unique across both teams; used by event players.
  optional string id = 6;
}

// Shared player/team stats. Missing values remain absent, not zero.
message Stats {
  optional uint32 points = 1;
  optional uint32 two_pointers_made = 2;
  optional uint32 two_pointers_attempted = 3;
  optional uint32 three_pointers_made = 4;
  optional uint32 three_pointers_attempted = 5;
  optional uint32 free_throws_made = 6;
  optional uint32 free_throws_attempted = 7;
  optional uint32 offensive_rebounds = 8;
  optional uint32 defensive_rebounds = 9;
  optional uint32 rebounds = 10;
  optional uint32 assists = 11;
  optional uint32 steals = 12;
  optional uint32 turnovers = 13;
  optional uint32 blocks = 14;
  optional uint32 personal_fouls = 15;
  // Player participation fields; leave absent in team totals.
  // Set only with source evidence; zero playing time does not prove DNP.
  optional bool played = 17;
  // Seconds played, including fractional seconds when reported.
  optional double seconds_played = 18;
  optional bool starter = 19;
}

message Event {
  // Unique within this game; use a stable source ID or source row identifier.
  string id = 1;
  EventType type = 2;
  // One-based period across the game, including overtime.
  optional uint32 period = 3;
  // Time remaining in this period: MM:SS, optionally with fractional seconds.
  optional string game_clock = 4;
  // Principal event team: true = home, false = away; absent for neutral/unknown.
  optional bool home = 5;
  repeated EventPlayer players = 6;
  // Cumulative game score after this event, when reported.
  optional uint32 home_score = 7;
  optional uint32 away_score = 8;
  // Shot details; leave absent for other event types.
  optional uint32 point_value = 9;
  optional bool made = 10;
  // Source subtype, e.g. defensive rebound, technical foul, or substitution in.
  optional string detail = 11;
  // Preserve the source wording, including unrecognized actions.
  optional string description = 12;
}

message EventPlayer {
  // References Player.id in this game; may belong to either team.
  string player_id = 1;
  // E.g. shooter, assister, incoming, outgoing, fouler, fouled; absent if unknown.
  optional string role = 2;
}

// Identity is (namespace, scope, value); preserve IDs as strings.
message ExternalId {
  // Examples: basketfi.match, genius.match, baskethotel.game, basketfi.team.
  string namespace = 1;
  string value = 2;
  // Set when the ID is only unique within a league, season, or game.
  optional string scope = 3;
}

enum GameStatus {
  GAME_STATUS_UNSPECIFIED = 0;
  GAME_STATUS_SCHEDULED = 1;
  GAME_STATUS_IN_PROGRESS = 2;
  GAME_STATUS_FINAL = 3;
  GAME_STATUS_POSTPONED = 4;
  GAME_STATUS_CANCELLED = 5;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_OTHER = 1;
  EVENT_TYPE_SHOT = 2;
  EVENT_TYPE_REBOUND = 3;
  EVENT_TYPE_ASSIST = 4;
  EVENT_TYPE_TURNOVER = 5;
  EVENT_TYPE_STEAL = 6;
  EVENT_TYPE_BLOCK = 7;
  EVENT_TYPE_FOUL = 8;
  EVENT_TYPE_SUBSTITUTION = 9;
  EVENT_TYPE_TIMEOUT = 10;
  EVENT_TYPE_JUMP_BALL = 11;
  EVENT_TYPE_GAME_START = 12;
  EVENT_TYPE_GAME_END = 13;
  EVENT_TYPE_PERIOD_START = 14;
  EVENT_TYPE_PERIOD_END = 15;
}
